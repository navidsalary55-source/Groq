body.dark{--ov:rgba(16,14,40,.82);--bg:#12102a;--card:rgba(29,26,63,.93);--tx:#f1efff;--mu:#a9a5d6}
*{box-sizing:border-box;font-family:Tahoma,Vazirmatn,sans-serif}body{margin:0;background:linear-gradient(var(--ov),var(--ov)),var(--cv) center/cover fixed;color:var(--tx);padding-top:env(safe-area-inset-top)}
.grad{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
header{display:flex;align-items:center;gap:10px;padding:16px;border-radius:0 0 28px 28px}header h1{font-size:19px;margin:0;flex:1}
.ib{background:#ffffff33;border:0;color:#fff;width:40px;height:40px;border-radius:14px;font-size:20px}

const RULES="تا از اصل بودن جنس و کالا مطمئن نشده‌اید یا کالا به دستتان نرسیده است، هیچ مبلغی پرداخت نکنید. مسئولیت هرگونه معامله و پرداخت بر عهده خود طرفین است و سازنده اپلیکیشن هیچ مسئولیتی نمی‌پذیرد.";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=JSON.parse(localStorage.bz||'{"biz":[],"chats":{},"users":[]}'),me=localStorage.me||null,view='home',cur=null,step='phone',ph='',code='',q='',city='',loc={};
const save=()=>localStorage.bz=JSON.stringify(db);
if(localStorage.dark)document.body.classList.add('dark');
function auth(){
 let h=`<div class="auth grad"><img src="${LG}" alt="" style="width:92px;height:92px;border-radius:24px;box-shadow:0 8px 30px #0007"><h1 onclick="tap()" style="font-size:27px;margin:12px 0 4px">بازارچه کسب و کار آنلاین</h1><p style="margin:0">بازار آنلاین کسب‌وکارهای شما</p><div class="card" style="color:var(--tx)">`;
 if(step=='phone')h+=`<b>ثبت‌نام / ورود</b><input id=ph type=tel placeholder="شماره موبایل مثلاً 09121234567"><button class=b onclick="sendCode()">دریافت کد تایید</button>`;
 if(step=='code')h+=`<b>کد تایید</b><p class=mu>${SMS&&API?'کد تایید پیامک شد 📩':'نسخه نمایشی: کد شما <b>'+code+'</b> است'}</p><input id=cd type=tel placeholder="کد ۴ رقمی"><button class=b onclick="chk()">تایید</button>`;
 if(step=='rules')h+=`<b>⚖️ قوانین و مسئولیت</b><p style="line-height:2">${RULES}</p><label><input type=checkbox id=ok style="width:auto"> قوانین را خواندم و می‌پذیرم</label><button class=b onclick="acc()">ورود به اپلیکیشن</button>`;
 $('#app').innerHTML=h+'</div><p style="text-align:center;margin-top:18px;font-size:13px;opacity:.85" onclick="aauth()">🛡️ ورود سازنده</p></div>'}
const call=(p,d)=>fetch(API+p,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json());
async function sendCode(){ph=$('#ph').value.trim();if(!/^09\d{9}$/.test(ph))return alert('شماره معتبر نیست');if((db.banned||[]).includes(ph))return alert('حساب شما مسدود شده است');
 if(SMS&&API){try{const r=await call('/send',{phone:ph});if(!r.ok)throw r}catch(e){return alert('ارسال پیامک ناموفق بود'+(e&&e.detail?'\n'+e.detail:''))}}else code=String(1000+Math.random()*9000|0);step='code';auth()}
async function chk(){const v=$('#cd').value.trim();let ok=v==code;
 if(SMS&&API){try{ok=(await call('/verify',{phone:ph,code:v})).ok}catch(e){ok=false}}
 if(!ok)return alert('کد اشتباه است');step='rules';auth()}
function acc(){if(!$('#ok').checked)return alert('برای ورود باید قوانین را بپذیرید');me=ph;localStorage.me=me;if(!db.users.includes(me))db.users.push(me);save();view='home';draw()}
function go(v,c){view=v;cur=c;$('#dr').classList.remove('open');draw()}
function card(b){return `<div class=card onclick="go('det','${b.id}')"><b>${esc(b.name)}</b> <span class=pr style="float:left">${prT(b)}</span><div class=mu>📍 ${esc(b.city)} · ${esc(b.type)}</div><div><span class=tag>${esc(b.guild)}</span><span class=tag>${esc(b.design)}</span><span class=tag>کیفیت: ${esc(b.quality)}</span></div></div>`}
function list(arr){return arr.length?arr.map(card).join(''):'<p class=mu style="text-align:center">موردی ثبت نشده است</p>'}
function home(){const r=db.biz.filter(b=>!b.hidden&&(!city||b.city==city)&&(esc(b.name+b.type+b.address+b.city+b.desc).includes(esc(q))));
 return `<input id=sq placeholder="🔍 جستجوی کسب‌وکار، کالا، شهر یا آدرس..." value="${esc(q)}" oninput="q=this.value;go('home')"><select onchange="city=this.value;go('home')"><option value="">همه شهرها</option>${CITIES.map(c=>`<option ${c==city?'selected':''}>${c}</option>`).join('')}</select>`+list(r)}
function reg(){return `<div class=card><b>ثبت کسب‌وکار</b><input id=n placeholder="نام کسب‌وکار"><input id=t placeholder="نوع کالا"><select id=pt onchange="ptc()"><option>قیمت هر عدد</option><option>قیمت کل</option><option>توافقی</option></select><input id=p type=number placeholder="مبلغ (تومان)"><input id=ph2 type=tel placeholder="شماره تماس" value="${/^09/.test(me)?me:''}">
<input id=c list=cl placeholder="🔍 جستجوی شهر"><datalist id=cl>${CITIES.map(c=>`<option>${c}`).join('')}</datalist><input id=a placeholder="آدرس">
<button class="b o" onclick="gps()">📍 ثبت لوکیشن من</button><div id=lc class=mu>${loc.lat?'لوکیشن ثبت شد ✓':''}</div>
<input id=g placeholder="کلاس صنفی (مثلاً کلاس الف / بازرگانی)"><input id=d placeholder="نو طرح (مثلاً: طرح جدید ۱۴۰۵)"><select id=ql><option>عالی</option><option>خوب</option><option>متوسط</option></select>
<textarea id=ds rows=3 placeholder="توضیحات"></textarea><button class=b onclick="addB()">ثبت کسب‌وکار</button></div>`}
function ptc(){$('#p').style.display=$('#pt').value=='توافقی'?'none':''}
const prT=b=>b.ptype=='توافقی'?'توافقی':esc(b.price)+' تومان'+(b.ptype=='قیمت هر عدد'?' (هر عدد)':b.ptype=='قیمت کل'?' (کل)':'');
function rate(){const r=Number(localStorage.rt||0);return `<div class=card style="text-align:center"><b>به بازارچه امتیاز بدهید</b><div style="font-size:40px;margin:14px 0;direction:ltr">${[1,2,3,4,5].map(i=>`<span onclick="setR(${i})">${i<=r?'⭐':'☆'}</span>`).join('')}</div><p class=mu>${r?'امتیاز شما: '+r+' از ۵ — ممنون! 🙏':'روی ستاره‌ها بزنید'}</p></div>`}
const setR=n=>{localStorage.rt=n;draw()};
const more=()=>`<div class=card style="text-align:center"><div style="font-size:48px">🚧</div><b>برنامه‌های جذاب دیگر</b><p class=mu>به‌زودی...</p></div>`;
function gps(){navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};$('#lc').textContent='لوکیشن ثبت شد ✓'},()=>alert('دسترسی به موقعیت داده نشد'))}
function addB(){const v=i=>$('#'+i).value.trim();if(!v('n')||(v('pt')!='توافقی'&&!v('p'))||!v('ph2'))return alert('نام، قیمت و تماس الزامی است');
 db.biz.unshift({id:Date.now()+'',owner:me,name:v('n'),type:v('t'),ptype:v('pt'),price:v('pt')=='توافقی'?'':v('p'),phone:v('ph2'),city:v('c'),address:v('a'),lat:loc.lat,lng:loc.lng,guild:v('g'),design:v('d'),quality:v('ql'),desc:v('ds')});loc={};save();alert('ثبت شد ✅');go('home')}
function det(){const b=db.biz.find(x=>x.id==cur);if(!b)return go('home');
 return `<div class=card><h2 style="margin:0">${esc(b.name)}</h2><p class=pr>💰 ${prT(b)}</p><p>📦 ${esc(b.type)}</p><p>📍 ${esc(b.city)}، ${esc(b.address)}</p><p>🏷️ صنف: ${esc(b.guild)} | ✨ ${esc(b.design)} | ⭐ ${esc(b.quality)}</p><p>${esc(b.desc)}</p>
 ${b.lat?`<a href="https://maps.google.com/?q=${b.lat},${b.lng}" target=_blank><button class="b o">🗺️ مشاهده روی نقشه</button></a>`:''}
 <a href="tel:${esc(b.phone)}"><button class=b>📞 تماس</button></a><button class=b onclick="go('chat','${b.id}|${me}')">💬 چت</button>
 ${b.owner==me||isAdm()?`<button class="b o" style="color:#e5384f;border-color:#e5384f" onclick="delB('${b.id}')">🗑️ حذف آگهی من</button>`:''}<p class=mu>⚠️ ${RULES}</p></div>`}
function delB(id){if(confirm('این آگهی برای همیشه حذف شود؟')){db.biz=db.biz.filter(x=>x.id!=id);save();go(view=='det'?'home':view)}}
function out(){if(confirm('از حساب خارج می‌شوید؟')){localStorage.removeItem('me');me=null;step='phone';draw()}}
function chat(){const m=db.chats[cur]||[];return `<div class=card>${m.map(x=>`<div class="msg ${x.f==me?'me':''}">${esc(x.t)}</div>`).join('')||'<p class=mu>گفتگو را شروع کنید</p>'}<input id=mt placeholder="پیام..."><button class=b onclick="send()">ارسال</button></div>`}
function send(){const t=$('#mt').value.trim();if(!t)return;(db.chats[cur]=db.chats[cur]||[]).push({f:me,t});save();draw()}
function inbox(){const mine=db.biz.filter(b=>b.owner==me).map(b=>b.id),k=Object.keys(db.chats).filter(k=>mine.includes(k.split('|')[0])||k.endsWith('|'+me));
 return k.length?k.map(x=>{const b=db.biz.find(y=>y.id==x.split('|')[0]);return `<div class=card onclick="go('chat','${x}')">💬 ${esc(b?b.name:'')} <span class=mu>(${x.split('|')[1]})</span></div>`}).join(''):'<p class=mu style="text-align:center">پیامی ندارید</p>'}
const isAdm=()=>Number((localStorage.at||'').split('.')[0])>Date.now();
let tapN=0,aStep='email',aMail='',atab='biz';
function tap(){if(++tapN>=5){tapN=0;aauth()}setTimeout(()=>tapN=0,3000)}
function aauth(){let h=`<div class="auth grad"><h1 style="font-size:28px;margin:0">🛡️ ورود سازنده</h1><div class=card style="color:var(--tx)">`;
 h+=aStep=='email'?`<b>ایمیل سازنده</b><input id=am type=email value="${esc(CT.email)}" readonly><button class=b onclick="aSend()">ارسال کد تایید</button>`:`<b>کد ارسال‌شده به ایمیل</b><input id=ac type=tel placeholder="کد ۴ رقمی"><button class=b onclick="aChk()">تایید و ورود</button>`;
 $('#app').innerHTML=h+`<button class="b o" onclick="aStep='email';me?draw():auth()">بازگشت</button></div></div>`}
async function aSend(){aMail=$('#am').value.trim().toLowerCase();if(!API)return alert('ابتدا آدرس Worker را در برنامه تنظیم کنید');
 try{await call('/admin/send',{email:aMail})}catch(e){return alert('ارسال ناموفق بود')}aStep='code';aauth()}
async function aChk(){try{const r=await call('/admin/verify',{email:aMail,code:$('#ac').value.trim()});if(!r.ok)throw 0;localStorage.at=r.token}catch(e){return alert('کد اشتباه است')}
 aStep='email';if(!me){me='مدیر';localStorage.me=me}view='admin';draw()}
const hideB=id=>{const b=db.biz.find(x=>x.id==id);b.hidden=!b.hidden;save();draw()};
const banU=u=>{const l=db.banned||[];db.banned=l.includes(u)?l.filter(x=>x!=u):[...l,u];save();draw()};
const delU=u=>{if(confirm('همه‌ی آگهی‌های این کاربر حذف شود؟')){db.biz=db.biz.filter(b=>b.owner!=u);save();draw()}};
const delC=k=>{if(confirm('گفتگو حذف شود؟')){delete db.chats[k];save();draw()}};
function admin(){if(!isAdm())return '<p>دسترسی ندارید</p>';const ub=db.banned||[];
 const tb=(k,t)=>`<button class=s style="${atab==k?'background:var(--p);color:#fff':''}" onclick="atab='${k}';draw()">${t}</button>`;
 let h=`<div class=card>👥 ${db.users.length} کاربر · 🏪 ${db.biz.length} آگهی (${db.biz.filter(b=>b.hidden).length} پنهان) · 💬 ${Object.keys(db.chats).length} گفتگو</div><div>${tb('biz','آگهی‌ها')}${tb('usr','کاربران')}${tb('cht','گفتگوها')}${tb('me','حساب')}</div>`;
 if(atab=='biz')h+=db.biz.map(b=>`<div class=card>${b.hidden?'🚫 ':''}<b>${esc(b.name)}</b> <span class=mu>${esc(b.owner)} · ${esc(b.city)}</span><div><button class=s onclick="go('det','${b.id}')">👁️ مشاهده</button><button class=s onclick="hideB('${b.id}')">${b.hidden?'✅ نمایش':'🙈 پنهان'}</button><button class="s r" onclick="delB('${b.id}')">🗑️ حذف</button></div></div>`).join('')||'<p class=mu>آگهی‌ای نیست</p>';
 if(atab=='usr')h+=db.users.map(u=>`<div class=card>${ub.includes(u)?'⛔ ':''}${esc(u)} <span class=mu>(${db.biz.filter(b=>b.owner==u).length} آگهی)</span><div><button class=s onclick="banU('${u}')">${ub.includes(u)?'رفع مسدودی':'🚫 مسدود'}</button><button class="s r" onclick="delU('${u}')">🗑️ حذف آگهی‌ها</button></div></div>`).join('')||'<p class=mu>کاربری نیست</p>';
 if(atab=='cht')h+=Object.keys(db.chats).map(k=>`<div class=card>💬 ${esc(k.split('|')[1])} ← ${esc((db.biz.find(b=>b.id==k.split('|')[0])||{}).name||'؟')}<div><button class=s onclick="go('chat','${k}')">مشاهده</button><button class="s r" onclick="delC('${k}')">🗑️ حذف</button></div></div>`).join('')||'<p class=mu>گفتگویی نیست</p>';
 if(atab=='me')h+=`<div class=card>ورود مدیر تا ۶ ساعت اعتبار دارد.<button class="b o" onclick="localStorage.removeItem('at');go('home')">خروج از پنل مدیریت</button></div>`;
 return h}
function contacts(){const rows=[['✉️','ایمیل',CT.email,CT.email&&'mailto:'+CT.email],['✈️','تلگرام',CT.tg,CT.tg&&'https://t.me/'+CT.tg.replace('@','')],['🟣','روبیکا',CT.rb,CT.rb&&'https://rubika.ir/'+CT.rb.replace('@','')],['🟢','واتساپ',CT.wa,'']];
return `<div class=card><div style="display:flex;gap:12px;align-items:center"><div class=tag style="font-size:18px;padding:12px 14px">ن.س</div><div><b>نوید سالاری</b><div class=mu>سازنده و توسعه‌دهنده‌ی اپلیکیشن</div></div></div>`+rows.map(([i,t,v,l])=>`<div class=card style="margin:8px 0;padding:12px;box-shadow:none;border:1px solid #8883">${i} <b>${t}</b>: ${l?`<a href="${esc(l)}" target=_blank>${esc(v)}</a>`:esc(v||'—')}</div>`).join('')+`<p class=mu>شناسه‌ی واتساپ به‌صورت آیدی ثبت شده و لینک مستقیم ندارد؛ برای تماس از طریق واتساپ همین آیدی را جست‌وجو کنید.</p></div>`}
function page(t,h){return `<div class=card><b>${t}</b><p style="line-height:2">${h}</p></div>`}
function sett(){return `<div class=card><b>تنظیمات</b><button class="b o" onclick="document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?1:'';">🌙 حالت شب / روز</button><button class="b o" onclick="localStorage.removeItem('me');me=null;step='phone';draw()">خروج از حساب</button></div>`+page('قوانین',RULES)}
const T={home:'بازارچه کسب و کار آنلاین',reg:'ثبت کسب‌وکار',det:'جزئیات',chat:'چت',inbox:'پیام‌ها',admin:'پنل مدیریت',set:'تنظیمات',about:'درباره ما',contact:'تماس با ما',support:'پشتیبانی',rate:'امتیاز به برنامه',more:'برنامه‌های جذاب'};
function draw(){if(me&&(db.banned||[]).includes(me)&&!isAdm()){localStorage.removeItem('me');me=null;alert('حساب شما مسدود شده است')}
 if(!me)return auth();
 $('#dr').innerHTML=`<h2 onclick="tap()"><img src="${LG}" alt="" style="width:34px;height:34px;border-radius:9px;vertical-align:middle"> بازارچه</h2><a onclick="go('inbox')">💬 پیام‌ها</a><a onclick="go('set')">⚙️ تنظیمات</a><a onclick="go('rate')">⭐ امتیاز به برنامه</a><a onclick="go('more')">✨ برنامه‌های جذاب دیگر</a><a onclick="go('support')">🛟 پشتیبانی</a><a onclick="go('contact')">📞 تماس با ما</a><a onclick="go('about')">ℹ️ درباره ما</a>${isAdm()?'<a onclick="go(\'admin\')">🛡️ پنل مدیریت</a>':''}`;
 const body={rate,more,home,reg,det,chat,inbox,admin,set:sett,about:()=>page('درباره ما','بازارچه بستری برای معرفی و تبلیغ کسب‌وکارها و ارتباط مستقیم با مشتریان است.<br>سازنده: <b>نوید سالاری</b>')+contacts(),contact:contacts,support:contacts}[view]();
 const nv=(v,i,t)=>`<a class="${view==v?'on':''}" onclick="go('${v}')"><span>${i}</span>${t}</a>`;
 const fi=document.activeElement&&document.activeElement.id=='sq';
 $('#app').innerHTML=`<header class=grad><button class=ib onclick="$('#dr').classList.toggle('open')">☰</button>${view=='home'?`<img src="${LG}" alt="" style="width:38px;height:38px;border-radius:11px">`:''}<h1>${T[view]}</h1>${view!='home'?'<button class=ib onclick="go(\'home\')">⌂</button>':''}</header><main>${body}</main><nav>${nv('home','🏠','خانه')}${nv('reg','➕','ثبت کسب‌وکار')}${nv('inbox','💬','پیام‌ها')}<a onclick="out()"><span>🚪</span>خروج</a></nav>`;
 if(fi){const e=$('#sq');e.focus();e.setSelectionRange(q.length,q.length)}}
draw();
</script></body></html>
