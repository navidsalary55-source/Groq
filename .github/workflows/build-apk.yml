name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      # امضای ثابت: هر ساخت جدید روی نسخه‌ی قبلی نصب می‌شود
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: node scripts/icons.js
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk}
